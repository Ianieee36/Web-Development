Description: Admin page where submitted booking request are being managed.
Searches for booking request via Booking Reference, which submit to admin.js

<!DOCTYPE HTML>

<!-- Declares HTML5 document type -->
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Title displayed in browser tab -->
    <title>CabsOnline</title>

    <!-- Links external CSS stylesheet -->
    <link rel="stylesheet" href="admin.css">

    <!-- Links external JavaScript file -->
    <!-- defer ensures JavaScript loads after HTML -->
    <script src="admin.js" defer></script>

</head>

<body>

    <!-- Main website heading with company logo -->
    <h1>
        <img src="Logo.PNG">
        CabsOnline
    </h1>

    <!-- Admin booking search section -->
    <div class="admin-search">

        <!-- Booking reference label -->
        <label for="bsearch">Booking Reference Number</label>

        <!-- Input field for booking reference search -->
        <input 
            type="text" 
            name="bsearch" 
            id="bsearch" 
            placeholder="Enter booking reference"
        >

        <!-- Search button -->
        <!-- Calls JavaScript search function -->
        <input 
            type="button" 
            name="sbutton" 
            id="sbutton" 
            value="Search"
        >

    </div>

    <!-- Displays validation and confirmation messages -->
    <p id="message"></p>

    <!-- Booking table content dynamically generated by JavaScript -->
    <div class="content" id="content"></div>

</body>
</html>
