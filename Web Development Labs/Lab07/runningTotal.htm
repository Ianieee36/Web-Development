<!DOCTYPE HTML>
<html>

<head>
    <title>Running Total</title>
    <script src="runningTotal.js"></script>
</head>

<body onload="changeColor('darkred')">

    <h1>Running Total</h1>

    <div id="output"></div>

    <script>
        let total = 0;
        let text = "";

        for (let i = 1; i <= 10; i++) {
            total += i;
            text += "Subtotal after adding " + i + " = " + total + "<br>";
        }

        document.getElementById("output").innerHTML = text;
    </script>

    <br><br>

    <button onclick="changeColor('lightgray')">Light Gray</button>
    <button onclick="changeColor('pink')">Pink</button>
    <button onclick="changeColor('yellow')">Yellow</button>

</body>

</html>
